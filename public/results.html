<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results · Analog Racing Club</title>
  <meta name="theme-color" content="#121212">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/nav.js" defer></script>
  <link rel="icon" href="/assets/analog_sq.png" type="image/png">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Analog Racing Club">
      <img class="brand-logo" src="/assets/logo.png" alt="Analog Racing Club">
    </a>
    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="siteNav"><span></span><span></span><span></span></button>
    <nav id="siteNav">
      <a href="/standings.html">Standings</a>
      <a href="/results.html" class="active">Results</a>
      <a href="/drivers.html">Power Rankings</a>
      <a href="/about.html">About</a>
    </nav>
    <a class="platform" href="https://discord.gg/jpchbxKu76" target="_blank" rel="noopener" aria-label="Join our Discord"><img src="/assets/Discord-Symbol-White.svg" alt="Discord"></a> <a class="platform" href="https://www.iracing.com/" target="_blank" rel="noopener" aria-label="Powered by iRacing"><img src="/assets/iracing.png" alt="iRacing"></a>
  </header>
  <main>
    <div class="page-head">
      <h2>Results</h2>
      <div id="pick"></div>
    </div>
    <p class="muted" id="seriesName"></p>
    <table id="table">
      <thead>
        <tr>
          <th class="round-col">Round</th>
          <th>Track</th>
          <th>Date</th>
          <th class="qual-col">Fast qualifier</th>
          <th class="feature-col">Feature winner</th>
          <th id="overallCol">Overall winner</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No races run yet — results appear after the first round.</p>
    <section id="detail" hidden>
      <h2 class="detail-title" id="detailTitle"></h2>
      <div class="cards" id="cards" hidden></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div id="tabPanel"></div>
      <div class="gallery-section" id="gallerySection" hidden>
        <h3 class="gallery-title">Photos</h3>
        <div id="galleryMount"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { api, el, driverName, fmtDate, gallery, gap, lapTime, roundTable, session, sessionKindsOf, sessionLabel, raceSessions, topQualifiers, trackName, winner, pickSeries, SPECIAL_SLUG } from '/app.js';
    const cell = (x) => (x?.finish ? `P${x.finish}` : '—');
    const $ = (id) => document.getElementById(id);
    // The series in view (a container, or the synthetic "Special events"
    // collection). Each event's layout comes from its own sub.eventType.
    let series = null;
    // The points multiplier of the round being shown (2 for a double-points
    // round), so the results tables display the same points the standings do.
    let currentMult = 1;

    // Tabs are declared by the event's own type — strictly. A declared session
    // shows its tab even when a round skipped it (the table then shows a
    // placeholder), and "Overall" appears when the type combines >1 session.
    function viewsFor(et) {
      const kinds = sessionKindsOf(et);
      const overall = et?.display?.overall && kinds.length > 1;
      return (overall ? [['overall', 'Overall']] : [])
        .concat(kinds.map((k) => [k, sessionLabel(et, k)]));
    }

    function overallTable(sub) {
      // One column per declared session, labelled by the event type (so a
      // league round reads Heat, a hosted round reads Race).
      const et = sub.eventType;
      const kinds = sessionKindsOf(et);
      const table = roundTable(sub);
      const scored = table.some((d) => d.total !== 0);
      const body = el('tbody', {});
      table.forEach((d, i) => body.append(el('tr', {},
        el('td', { class: 'pos' }, String(i + 1)),
        el('td', {}, driverName(d.name)),
        ...kinds.map((k) => el('td', { class: 'num' }, cell(d[k]))),
        ...(scored ? [el('td', { class: 'num total' }, String(d.total * currentMult))] : []))));
      return el('table', {},
        el('thead', {}, el('tr', {},
          el('th', { class: 'pos' }, 'Pos'),
          el('th', {}, 'Driver'),
          ...kinds.map((k) => el('th', { class: 'num' }, sessionLabel(et, k))),
          ...(scored ? [el('th', { class: 'num' }, currentMult > 1 ? 'Points 2×' : 'Points')] : []))),
        body);
    }

    // Each session gets the columns that matter for it: qualifying compares
    // lap times against pole; races show laps led and the gap at the flag.
    // Gap to the session leader. Qualifying derives it from the lap times we
    // store, so it works without the `interval` field older results lack;
    // races need the stored interval, since a gap at the flag is not a lap
    // delta (backmarkers can be laps down).
    // Winner on points across the round — the top of the Overall tab.
    const overallWinner = (sub) => (sub ? driverName(roundTable(sub)[0]?.name) : null);

    const qualGap = (rows, x) => {
      const pole = rows.find((r) => r.finish === 1)?.bestLapTime;
      if (!pole || !x.bestLapTime) return null;
      return x.bestLapTime - pole;
    };

    const raceBehind = (rows, x) => {
      if (x.finish === 1) return null;
      if (x.interval != null) return gap(x.interval);
      // Older results predate the stored interval; fall back to laps down.
      const lead = rows.find((r) => r.finish === 1);
      const down = (lead?.lapsComplete ?? 0) - (x.lapsComplete ?? 0);
      return down > 0 ? `${down} lap${down > 1 ? 's' : ''}` : null;
    };

    const SESSION_COLS = {
      qualifying: [
        // The leader's lap time, then everyone else's deficit to it.
        { head: 'Time / gap', cell: (x, rows) => {
          if (x.finish === 1) return lapTime(x.bestLapTime);
          const d = qualGap(rows, x);
          return d == null ? null : (d > 0 ? gap(d) : lapTime(x.bestLapTime));
        } },
      ],
      sprint: [
        { head: 'Start', cell: (x) => (x.start ? `P${x.start}` : null) },
        { head: 'Laps led', cell: (x) => (x.lapsLead ? String(x.lapsLead) : null) },
        { head: 'Behind', cell: (x, rows) => raceBehind(rows, x) },
        { head: 'Best lap', cell: (x) => lapTime(x.bestLapTime) },
      ],
      feature: [
        { head: 'Start', cell: (x) => (x.start ? `P${x.start}` : null) },
        { head: 'Laps led', cell: (x) => (x.lapsLead ? String(x.lapsLead) : null) },
        { head: 'Behind', cell: (x, rows) => raceBehind(rows, x) },
        { head: 'Best lap', cell: (x) => lapTime(x.bestLapTime) },
      ],
    };

    // One session, ordered by finishing position, with the points it awarded.
    function sessionTable(sub, kind) {
      const rows = (session(sub, kind)?.results ?? [])
        .slice()
        .sort((a, b) => (a.finish ?? Infinity) - (b.finish ?? Infinity));
      if (!rows.length) return el('p', { class: 'empty' }, 'No results for this session.');
      // Drop columns with nothing in them: an unscored special event has no
      // points, and a standing-start-only event has no grid positions.
      const cols = (SESSION_COLS[kind] ?? []).filter((c) => rows.some((x) => c.cell(x, rows) != null));
      const scored = rows.some((x) => (x.points?.total ?? 0) !== 0);
      const body = el('tbody', {});
      for (const x of rows) {
        const extra = cols.map((c) => {
          const v = c.cell(x, rows);
          return el('td', { class: v == null ? 'num muted' : 'num' }, v ?? '—');
        });
        body.append(el('tr', {},
          el('td', { class: 'pos' }, x.finish == null ? '—' : String(x.finish)),
          el('td', {}, driverName(x.displayName)),
          ...extra,
          ...(scored ? [el('td', { class: 'num total' }, String((x.points?.total ?? 0) * currentMult))] : [])));
      }
      return el('table', {},
        el('thead', {}, el('tr', {},
          el('th', { class: 'pos' }, 'Pos'),
          el('th', {}, 'Driver'),
          ...cols.map((c) => el('th', { class: 'num' }, c.head)),
          ...(scored ? [el('th', { class: 'num' }, currentMult > 1 ? 'Points 2×' : 'Points')] : []))),
        body);
    }

    const renderView = (sub, view) =>
      view === 'overall' ? overallTable(sub) : sessionTable(sub, view);

    // Summary cards, keyed by the ids the event type declares. Each returns a
    // card element (or null to skip). The backend owns which cards appear; the
    // frontend owns how they look.
    const cardEl = (title, ...rows) =>
      el('div', { class: 'card' }, el('h3', { class: 'card-title' }, title),
        el('dl', { class: 'card-rows' }, ...rows));
    const cardRow = (dt, dd) => el('div', { class: 'card-row' }, el('dt', {}, dt), el('dd', {}, dd || '—'));
    const CARD_RENDERERS = {
      // Who made the Fast Four — the qualifying places the format pays. Four
      // places keeps the name; any other count is described generically.
      'fast-four': (sub) => {
        const places = series?.qualifyingPlaces ?? 0;
        const qualifiers = topQualifiers(sub, places);
        if (!qualifiers.length) return null;
        return cardEl(places === 4 ? 'Fast Four' : `Top ${places} qualifiers`,
          ...qualifiers.map((q) => cardRow(`Q${q.finish}`, q.name)));
      },
      // The winner of each race the event ran, by the event type's labels.
      'heat-feature-winners': (sub) => {
        const rows = raceSessions(sub.eventType).map((s) => cardRow(s.label, winner(sub, s.kind)));
        return rows.length ? cardEl('Winners', ...rows) : null;
      },
    };

    function renderCards(sub) {
      const mount = $('cards');
      mount.innerHTML = '';
      const cards = (sub.eventType?.display?.cards ?? [])
        .map((id) => CARD_RENDERERS[id]?.(sub))
        .filter(Boolean);
      for (const c of cards) mount.append(c);
      mount.hidden = !cards.length;
    }

    function showRound(r) {
      const sub = r.subsessions[0];
      currentMult = r.multiplier || 1;
      const tabs = $('tabs'), panel = $('tabPanel');
      tabs.innerHTML = '';
      const select = (view) => {
        panel.innerHTML = '';
        panel.append(renderView(sub, view));
        for (const b of tabs.children) {
          const on = b.dataset.view === view;
          b.classList.toggle('active', on);
          b.setAttribute('aria-selected', String(on));
        }
      };
      for (const [view, title] of viewsFor(sub.eventType)) {
        const btn = el('button', { class: 'tab', type: 'button', role: 'tab' }, title);
        btn.dataset.view = view;
        btn.addEventListener('click', () => select(view));
        tabs.append(btn);
      }
      select(tabs.firstElementChild?.dataset.view ?? 'overall');
      renderCards(sub);
      $('detailTitle').textContent = [
        oneOff ? null : `Round ${r.round}`,
        r.multiplier > 1 ? `${r.multiplier}× points` : null,
        trackName(sub),
        sub.cars?.length ? sub.cars.join(' · ') : null,
      ].filter(Boolean).join(' · ');
      const mount = $('galleryMount');
      mount.innerHTML = '';
      const shots = gallery(sub);
      if (shots) mount.append(shots);
      $('gallerySection').hidden = !shots;
      $('detail').hidden = false;
    }

    let oneOff = false;
    async function load(slug) {
      // The "Special events" collection is a sentinel, not a real series slug.
      const data = await api(slug === SPECIAL_SLUG
        ? '/api/results?special=1'
        : `/api/results?series=${encodeURIComponent(slug)}`);
      series = data.series;
      // A single-round competition (or the specials list) has no round number.
      oneOff = !!series?.singleRound;
      const body = $('body'); body.innerHTML = '';
      for (const cell of document.querySelectorAll('#table thead .round-col')) cell.hidden = oneOff;
      // The winner-column label/collapse follows the events' type. A container
      // is homogeneous, so the first event that ran is representative.
      const et = data.rounds.map((r) => r.subsessions[0]).find(Boolean)?.eventType;
      const single = sessionKindsOf(et).length <= 1;
      // Pole only means something when the event type runs a qualifying session.
      const hasQual = sessionKindsOf(et).includes('qualifying');
      $('overallCol').textContent = single ? 'Winner' : 'Overall winner';
      for (const cell of document.querySelectorAll('#table thead .qual-col')) cell.hidden = !hasQual;
      for (const cell of document.querySelectorAll('#table thead .feature-col')) {
        cell.hidden = single;
        cell.textContent = `${sessionLabel(et, 'feature')} winner`;
      }
      $('detail').hidden = true;
      $('seriesName').textContent = `${data.series.name} · ${data.series.typeLabel}`;
      let anyRun = false;
      for (const r of data.rounds) {
        const sub = r.subsessions[0];
        const track = sub ? trackName(sub) : r.track;
        const m = (v) => (v ? {} : { class: 'muted' });
        const row = el('tr', {},
          el('td', { class: 'pos round-col', ...(oneOff ? { hidden: 'hidden' } : {}) },
            r.round == null ? '' : String(r.round), ...(r.multiplier > 1 ? [el('span', { class: 'mult-badge' }, `${r.multiplier}×`)] : [])),
          el('td', m(track),
            el('span', { class: 'track-name' }, track || '—'),
            ...(sub?.cars?.length ? [el('span', { class: 'track-cars' }, sub.cars.join(' · '))] : [])),
          el('td', m(sub), sub ? fmtDate(sub.startTime) : r.date || 'TBD'),
          el('td', { class: sub ? 'qual-col' : 'qual-col muted', ...(hasQual ? {} : { hidden: 'hidden' }) }, winner(sub, 'qualifying') || '—'),
          el('td', { class: sub ? 'feature-col' : 'feature-col muted', ...(single ? { hidden: 'hidden' } : {}) }, winner(sub, 'feature') || '—'),
          el('td', m(sub), overallWinner(sub) || '—'));
        if (sub) {
          anyRun = true;
          row.style.cursor = 'pointer';
          row.addEventListener('click', () => { showRound(r); $('detail').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
        }
        body.append(row);
      }
      $('empty').hidden = anyRun;
      const want = Number(new URLSearchParams(location.search).get('round'));
      const first = data.rounds.find((r) => r.round === want && r.subsessions.length);
      if (first) showRound(first);
    }
    const slug = await pickSeries($('pick'), load);
    if (slug) await load(slug); else $('empty').hidden = false;
  </script>
  <footer>Analog Racing Club · an iRacing league</footer>
</body>
</html>
