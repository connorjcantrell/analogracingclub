<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drivers · Analog Racing Club</title>
  <meta name="theme-color" content="#221f20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/assets/logo.png" type="image/png">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Analog Racing Club">
      <img class="brand-logo" src="/assets/logo.png" alt="Analog Racing Club">
    </a>
    <nav>
      <a href="/standings.html">Standings</a>
      <a href="/results.html">Results</a>
      <a href="/drivers.html" class="active">Drivers</a>
      <a href="/about.html">About</a>
    </nav>
    <a class="platform" href="https://www.iracing.com/" target="_blank" rel="noopener" aria-label="Powered by iRacing"><img src="/assets/iracing.png" alt="iRacing"></a>
  </header>
  <main>
    <h2>Drivers</h2>
    <table id="table">
      <thead>
        <tr>
          <th class="pos">#</th>
          <th>Driver</th>
          <th class="num">iRacing ID</th>
        </tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No drivers registered yet.</p>
  </main>
  <script type="module">
    import { api, el, driverName } from '/app.js';
    const drivers = await api('/api/drivers');
    const body = document.getElementById('body');
    drivers.forEach((d, i) => body.append(el('tr', {},
      el('td', { class: 'pos' }, String(i + 1)),
      el('td', {}, driverName(d.displayName)),
      el('td', { class: 'num muted' }, String(d.custId)))));
    if (!drivers.length) { document.getElementById('empty').hidden = false; document.getElementById('table').hidden = true; }
  </script>
  <footer>Analog Racing Club · an iRacing league</footer>
</body>
</html>
