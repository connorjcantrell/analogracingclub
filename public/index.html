<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Racing Club</title>
  <meta name="description" content="Analog Racing Club — an iRacing league.">
  <meta name="theme-color" content="#3d393a">
  <link rel="icon" href="/assets/logo.png" type="image/png">
  <style>
    :root {
      --bg: #3d393a;
      --fg: #faebd7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .logo {
      width: min(320px, 70vw);
      height: auto;
      display: block;
    }

    h1 {
      margin: 0.5rem 0 0;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/assets/logo.png" alt="Analog" width="450" height="450">
    <h1>Racing Club</h1>
  </main>
</body>
</html>
