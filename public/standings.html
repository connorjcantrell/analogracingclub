<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standings · Analog Racing Club</title>
  <meta name="theme-color" content="#221f20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/assets/analog_sq.png" type="image/png">
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Analog Racing Club">
      <img class="brand-logo" src="/assets/analog_sq.png" alt="Analog Racing Club">
    </a>
    <nav>
      <a href="/standings.html" class="active">Standings</a>
      <a href="/results.html">Results</a>
      <a href="/drivers.html">Power Rankings</a>
      <a href="/about.html">About</a>
    </nav>
    <a class="platform" href="https://www.iracing.com/" target="_blank" rel="noopener" aria-label="Powered by iRacing"><img src="/assets/iracing.png" alt="iRacing"></a>
  </header>
  <main>
    <div class="page-head">
      <h2>Standings</h2>
      <div id="pick"></div>
    </div>
    <p class="muted" id="seriesName"></p>
    <table id="table">
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <p class="empty" id="empty" hidden>No results yet — standings appear after the first round.</p>
  </main>
  <script type="module">
    import { api, el, driverName, pickSeries } from '/app.js';
    const $ = (id) => document.getElementById(id);
    async function load(slug) {
      const data = await api(`/api/standings?series=${encodeURIComponent(slug)}`);
      const head = $('head'), body = $('body');
      head.innerHTML = ''; body.innerHTML = '';
      $('seriesName').textContent = `${data.series.name} · ${data.series.typeLabel}`;
      head.append(el('th', { class: 'pos' }, 'Pos'), el('th', {}, 'Driver'));
      for (const r of data.rounds) head.append(el('th', { class: 'num' }, `R${r}`));
      head.append(el('th', { class: 'num' }, 'Total'));
      data.standings.forEach((d, i) => body.append(el('tr', {},
        el('td', { class: 'pos' }, String(i + 1)),
        el('td', {}, driverName(d.displayName)),
        ...data.rounds.map((r) => d.rounds[r] == null
          ? el('td', { class: 'num muted' }, '—')
          : el('td', { class: 'num' }, String(d.rounds[r]))),
        el('td', { class: 'num total' }, String(d.total)))));
      $('empty').hidden = data.standings.length > 0;
      $('table').hidden = !data.standings.length;
    }
    const slug = await pickSeries($('pick'), load);
    if (slug) await load(slug); else { $('empty').hidden = false; $('table').hidden = true; }
  </script>
  <footer>Analog Racing Club · an iRacing league</footer>
</body>
</html>
